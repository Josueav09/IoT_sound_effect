name: Release (.exe)

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compilar con PyInstaller
        run: |
          pip install pyinstaller
          pyinstaller --onefile --noconsole --name TecladoSonidos teclado_sonidos.py

      - name: Armar paquete
        shell: pwsh
        run: |
          $dir = "TecladoSonidos"
          New-Item -ItemType Directory $dir | Out-Null
          Copy-Item dist/TecladoSonidos.exe, iniciar.bat, configurar.bat, detener.bat, README.md, LICENSE, config.ejemplo.json $dir
          Copy-Item -Recurse sonidos $dir
          Compress-Archive -Path $dir -DestinationPath TecladoSonidos-windows.zip

      - name: Subir artefacto
        uses: actions/upload-artifact@v4
        with:
          name: TecladoSonidos-windows
          path: TecladoSonidos-windows.zip

      - name: Publicar release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: TecladoSonidos-windows.zip
